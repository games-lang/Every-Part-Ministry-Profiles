        planningStyle: { type: string, enum: [plan-ahead, adapt-as-you-go, last-minute-energy] }
        peopleLogic: { type: string, enum: [people-first, balance-both, details-and-ideas] }
        actionReflection: { type: string, enum: [act-then-reflect, reflect-then-act, move-between-both] }
        leadershipSupport: { type: string, enum: [take-the-lead, support-the-lead, share-leadership] }
        conflictStyle: { type: string, enum: [address-it-directly, listen-and-find-common-ground, pause-and-seek-guidance] }
        teamPreference: { type: string, enum: [close-team, variety-of-people, independent-with-check-ins] }
