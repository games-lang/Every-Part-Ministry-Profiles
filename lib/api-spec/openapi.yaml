        students: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        worship: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        production: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        scriptureReading: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        communityCare: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        missions: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        creative: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        events: { $ref: "#/components/schemas/YouthOpportunityResponse" }
        behindTheScenes: { $ref: "#/components/schemas/YouthOpportunityResponse" }
    DevelopProfileResult:
      type: object
      additionalProperties: false
      required: [profileType, childName, summary, guardian]
      properties:
        profileType: { type: string, enum: [develop] }
        childName: { type: string }
        summary:
          type: object
          additionalProperties: false
          required: [headline, strengths, tendencySummary, giftsToExplore, callingSummary, ministryInterests, developmentPlan, completionCopy]
          properties:
            headline: { type: string }
            strengths:
              type: array
              minItems: 1
              maxItems: 3
              items: { type: string }
            tendencySummary: { type: string }
            giftsToExplore:
              type: array
              minItems: 1
              maxItems: 5
              items: { type: string }
