openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: churches
    description: Church setup and public profile access
  - name: dashboard
    description: Pastor and administrator dashboard operations
  - name: profiles
    description: Ministry Profile submissions and results
  - name: teams
    description: Church ministry team management
  - name: youth-profiles
    description: Guardian-consented youth discovery profiles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /church:
    get:
      operationId: getMyChurch
      tags: [churches]
      summary: Get the signed-in administrator's church
      responses:
        "200":
          description: Church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Church"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMyChurch
      tags: [churches]
      summary: Update church setup information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchUpdate"
      responses:
        "200":
          description: Updated church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Church"
        "401":
          description: Unauthorized
  /church/admins:
    get:
      operationId: listChurchAdmins
      tags: [churches]
      summary: List pastors with access to the signed-in church
      responses:
        "200":
          description: Church administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChurchAdmin"
        "401":
          description: Unauthorized
    post:
      operationId: addChurchAdmin
      tags: [churches]
      summary: Add an existing Clerk user as a church administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchAdminAddInput"
      responses:
        "201":
          description: Added administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchAdmin"
        "400":
          description: Invalid administrator
        "401":
          description: Unauthorized
        "404":
          description: No Clerk account was found for the email address
        "409":
          description: User is already an administrator
  /church/admins/{id}:
    delete:
      operationId: removeChurchAdmin
      tags: [churches]
      summary: Remove a pastor's access to the signed-in church
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Administrator removed
        "400":
          description: The church owner cannot be removed
        "401":
          description: Unauthorized
        "404":
          description: Administrator not found
  /churches/{slug}:
    get:
      operationId: getPublicChurch
      tags: [churches]
      summary: Get the public church profile destination
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public church information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChurch"
        "404":
          description: Church not found
        "422":
          description: Church assessment configuration is invalid
  /churches/{slug}/admin-access:
    get:
      operationId: getChurchAdminAccess
      tags: [churches]
      summary: Check whether the signed-in user may override a youth pathway
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Church-specific override access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchAdminAccess"
        "401":
          description: Unauthorized
        "404":
          description: Church not found
  /churches/{slug}/logo:
    get:
      operationId: getPublicChurchLogo
      tags: [churches]
      summary: Get the approved public logo for a church
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Church logo image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Logo not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [churches]
      summary: Request an authenticated image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata
        "401":
          description: Unauthorized
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard totals and recent profile activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams for the signed-in church
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MinistryTeam"
        "401":
          description: Unauthorized
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team for the signed-in church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreateInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryTeam"
        "400":
          description: Invalid team
        "401":
          description: Unauthorized
  /teams/{id}:
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update or archive a church team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdateInput"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryTeam"
        "400":
          description: Invalid team
        "401":
          description: Unauthorized
        "404":
          description: Team not found
  /teams/suggestions:
    post:
      operationId: generateTeamSuggestions
      tags: [teams]
      summary: Suggest starter ministry teams from completed profiles
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSuggestionsInput"
      responses:
        "200":
          description: Starter team suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSuggestionsResponse"
        "400":
          description: Invalid suggestion request
        "401":
          description: Unauthorized
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List completed Ministry Profiles for the signed-in church
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: interest
          in: query
          required: false
          schema:
            type: string
        - name: passion
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileListItem"
        "401":
          description: Unauthorized
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Submit a Ministry Profile for a church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Submitted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryProfile"
        "400":
          description: Invalid profile
        "404":
          description: Church not found
  /profiles/matches:
    post:
      operationId: findVolunteerMatches
      tags: [profiles]
      summary: Find same-church Ministry Profiles that may fit a ministry need
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerMatchInput"
      responses:
        "200":
          description: Advisory volunteer matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerMatchResponse"
        "400":
          description: Invalid matching criteria
        "401":
          description: Unauthorized
  /youth-profiles:
    post:
      operationId: submitDiscoverProfile
      tags: [youth-profiles]
      summary: Submit a guardian-consented Discover profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverProfileInput"
      responses:
        "201":
          description: Submitted youth profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverProfileSubmission"
        "400":
          description: Invalid youth profile
        "404":
          description: Church not found
  /youth-profiles/{id}/result:
    get:
      operationId: getDiscoverResult
      tags: [youth-profiles]
      summary: Retrieve a youth discovery result with its opaque token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guardian-safe youth result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverProfileResult"
        "404":
          description: Result not found
  /explore-profiles:
    post:
      operationId: submitExploreProfile
      tags: [youth-profiles]
      summary: Submit a guardian-consented Explore profile for ages 9 through 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreProfileInput"
      responses:
        "201":
          description: Submitted Explore profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreProfileSubmission"
        "400":
          description: Invalid Explore profile
        "404":
          description: Church not found
  /explore-profiles/{id}/result:
    get:
      operationId: getExploreResult
      tags: [youth-profiles]
      summary: Retrieve a guardian-safe Explore result with its opaque token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guardian-safe Explore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreProfileResult"
        "404":
          description: Result not found
  /develop-profiles:
    post:
      operationId: submitDevelopProfile
      tags: [youth-profiles]
      summary: Submit a guardian-consented Develop profile for ages 13 through 17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopProfileInput"
      responses:
        "201":
          description: Submitted Develop profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopProfileSubmission"
        "400":
          description: Invalid Develop profile
        "404":
          description: Church not found
  /develop-profiles/{id}/result:
    get:
      operationId: getDevelopResult
      tags: [youth-profiles]
      summary: Retrieve a guardian-safe Develop result with its opaque token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guardian-safe Develop result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopProfileResult"
        "404":
          description: Result not found
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: View a completed Ministry Profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryProfile"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found
  /profiles/{id}/team:
    patch:
      operationId: updateProfileTeam
      tags: [profiles]
      summary: Assign or remove a profile's current team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileTeamUpdateInput"
      responses:
        "200":
          description: Updated profile team assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileTeamAssignment"
        "400":
          description: Invalid team assignment
        "401":
          description: Unauthorized
        "404":
          description: Profile or team not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Church:
      type: object
      required: [id, name, slug, profileUrl, adminName, adminEmail, primaryColor, accentColor, assessmentConfiguration]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        address: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        adminName: { type: string }
        adminEmail: { type: string, format: email }
        profileUrl: { type: string }
        completedProfileCount: { type: integer }
        enabledSpiritualGifts:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/SpiritualGiftName"
          uniqueItems: true
        assessmentConfiguration:
          $ref: "#/components/schemas/AssessmentConfiguration"
    ChurchUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        logoUrl:
          type: ["string", "null"]
          pattern: "^/objects/logos/[0-9]+/[0-9a-fA-F-]+$"
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        address: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        adminName: { type: string }
        adminEmail: { type: string, format: email }
        enabledSpiritualGifts:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpiritualGiftName"
        assessmentConfiguration:
          $ref: "#/components/schemas/AssessmentConfiguration"
    ChurchAdmin:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role:
          type: string
          enum: [owner, admin]
        createdAt: { type: string, format: date-time }
    ChurchAdminAddInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ChurchAdminAccess:
      type: object
      additionalProperties: false
      required: [canOverrideYouthPathway]
      properties:
        canOverrideYouthPathway: { type: boolean }
    PublicChurch:
      type: object
      required: [name, slug, profileUrl, enabledSpiritualGifts, primaryColor, accentColor, assessmentConfiguration]
      properties:
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        profileUrl: { type: string }
        enabledSpiritualGifts:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpiritualGiftName"
        assessmentConfiguration:
          $ref: "#/components/schemas/AssessmentConfiguration"
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 5242880
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    SpiritualGiftName:
      type: string
      enum:
        - Administration
        - Apostleship
        - Discernment of Spirits
        - Evangelism
        - Exhortation / Encouragement
        - Faith
        - Giving
        - Healing
        - Helps / Service
        - Hospitality
        - Interpretation of Tongues
        - Knowledge
        - Leadership
        - Mercy
        - Miracles
        - Pastoring / Shepherding
        - Prophecy
        - Teaching
        - Tongues
        - Wisdom
        - Craftsmanship
        - Intercession
        - Missionary / Cross-Cultural Ministry
        - Music / Worship
        - Celibacy
        - Voluntary Poverty
    DashboardSummary:
      type: object
      required: [church, totalProfiles, recentProfiles, topInterests, topPassions, teamCount, activeTeamCount, assignedProfileCount]
      properties:
        church:
          $ref: "#/components/schemas/Church"
        totalProfiles: { type: integer }
        recentProfiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileListItem"
        topInterests:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        topPassions:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        teamCount: { type: integer }
        activeTeamCount: { type: integer }
        assignedProfileCount: { type: integer }
    CountItem:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    ProfileListItem:
      type: object
      required: [id, memberName, email, completedAt, interests, passions, availability, teamId, profileType, age]
      properties:
        id: { type: integer }
        memberName: { type: string }
        email: { type: string, format: email }
        completedAt: { type: string, format: date-time }
        interests:
          type: array
          items: { type: string }
        passions:
          type: array
          items: { type: string }
        availability:
          type: array
          items: { type: string }
        servingFrequency: { type: ["string", "null"] }
        teamId: { type: ["integer", "null"] }
        profileType: { type: string, enum: [adult, discover, explore, develop] }
        age: { type: ["integer", "null"], minimum: 6, maximum: 120 }
    MinistryTeam:
      type: object
      required: [id, name, description, isArchived, memberCount, members]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        isArchived: { type: boolean }
        memberCount: { type: integer }
        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
    TeamMember:
      type: object
      required: [id, memberName, email, completedAt]
      properties:
        id: { type: integer }
        memberName: { type: string }
        email: { type: string, format: email }
        completedAt: { type: string, format: date-time }
    TeamCreateInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ["string", "null"], maxLength: 500 }
    TeamUpdateInput:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: ["string", "null"], maxLength: 500 }
        isArchived: { type: boolean }
    TeamSuggestionsInput:
      type: object
      additionalProperties: false
      properties:
        focus: { type: string, maxLength: 240 }
    TeamSuggestionsResponse:
      type: object
      required: [suggestions, summary, advisory, usedAi]
      properties:
        suggestions:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/TeamSuggestion"
        summary: { type: string }
        advisory: { type: string }
        usedAi: { type: boolean }
    TeamSuggestion:
      type: object
      required: [id, name, purpose, supportingSignals, candidates]
      properties:
        id: { type: string }
        name: { type: string }
        purpose: { type: string }
        supportingSignals:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string }
        candidates:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/TeamSuggestionCandidate"
    TeamSuggestionCandidate:
      type: object
      required: [id, memberName, reasons, interests, passions, isAssigned]
      properties:
        id: { type: integer }
        memberName: { type: string }
        reasons:
          type: array
          minItems: 1
          maxItems: 2
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        passions:
          type: array
          items: { type: string }
        isAssigned: { type: boolean }
    ProfileTeamUpdateInput:
      type: object
      required: [teamId]
      additionalProperties: false
      properties:
        teamId: { type: ["integer", "null"] }
    ProfileTeamAssignment:
      type: object
      required: [profileId, teamId, teamName]
      properties:
        profileId: { type: integer }
        teamId: { type: ["integer", "null"] }
        teamName: { type: ["string", "null"] }
    VolunteerMatchInput:
      type: object
      required: [roleDescription]
      properties:
        roleDescription:
          type: string
          minLength: 20
          maxLength: 2000
        ministryArea:
          type: string
          maxLength: 120
        preferredExperience:
          type: string
          maxLength: 500
        availability:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
    VolunteerMatchCandidate:
      type: object
      required: [id, memberName, score, matchLevel, reasons, interests, passions, availability, servingFrequency]
      properties:
        id: { type: integer }
        memberName: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        matchLevel:
          type: string
          enum: [Strong fit, Potential fit, Worth exploring]
        reasons:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        passions:
          type: array
          items: { type: string }
        availability:
          type: array
          items: { type: string }
        servingFrequency: { type: ["string", "null"] }
    VolunteerMatchResponse:
      type: object
      required: [candidates, summary, advisory, usedAi]
      properties:
        candidates:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/VolunteerMatchCandidate"
        summary: { type: string }
        advisory: { type: string }
        usedAi: { type: boolean }
    MinistryProfile:
      allOf:
        - $ref: "#/components/schemas/ProfileListItem"
        - type: object
          required: [basicInformation, churchConnection, skills, experience, assessmentSections, assessmentConfiguration, conversations, recommendedProfileType, profileTypeOverridden, youthResponses, guardianObservations, guardian, youth]
          properties:
            basicInformation:
              $ref: "#/components/schemas/BasicInformation"
            churchConnection:
              $ref: "#/components/schemas/ChurchConnection"
            skills:
              $ref: "#/components/schemas/SkillsAndExperience"
            experience:
              { type: string }
            assessmentSections:
              $ref: "#/components/schemas/FutureAssessmentSections"
            assessmentConfiguration:
              $ref: "#/components/schemas/AssessmentConfiguration"
            conversations:
              type: array
              items: { type: string }
            lifeExperiences: { type: ["object", "null"], additionalProperties: true }
            availabilityDetails: { type: ["object", "null"], additionalProperties: true }
            ministryPreferences: { type: ["object", "null"], additionalProperties: true }
            recommendedProfileType: { type: ["string", "null"], enum: [adult, discover, explore, develop, null] }
