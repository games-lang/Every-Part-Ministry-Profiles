openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: churches
    description: Church setup and public profile access
  - name: dashboard
    description: Pastor and administrator dashboard operations
  - name: profiles
    description: Ministry Profile submissions and results
  - name: people
    description: Church people and Ministry Profile invitations
  - name: teams
    description: Church ministry team management
  - name: youth-profiles
    description: Guardian-consented youth discovery profiles
  - name: app-admin
    description: Every Part app administrator feedback operations
  - name: assistant
    description: Public Every Part website assistant
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/chat:
    post:
      operationId: chatWithAssistant
      tags: [assistant]
      summary: Chat with the public Every Part assistant
      description: Streams a product-guidance response for public website visitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantChatInput"
      responses:
        "200":
          description: Server-sent events containing assistant text chunks
          content:
            text/event-stream: {}
        "400":
          description: Invalid chat input
        "429":
          description: Too many requests
        "502":
          description: AI service unavailable
  /assistant/partfinder:
    post:
      operationId: chatWithPartFinder
      tags: [assistant]
      summary: Ask the authenticated PartFinder ministry discovery assistant
      description: Uses tenant-scoped adult profile signals for advisory volunteer discovery and church insights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartFinderInput"
      responses:
        "200":
          description: PartFinder answer and locally verified profile recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartFinderResponse"
        "400":
          description: Invalid PartFinder request
        "401":
          description: Unauthorized
        "502":
          description: AI service unavailable
  /partfinder/leadership-profile:
    get:
      operationId: getPartFinderLeadershipProfile
      tags: [assistant]
      summary: Get the signed-in leader's transparent PartFinder profile
      responses:
        "200":
          description: Leadership profile and personalization preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartFinderLeadershipProfile"
        "401":
          description: Unauthorized
    put:
      operationId: updatePartFinderLeadershipProfile
      tags: [assistant]
      summary: Save the signed-in leader's transparent PartFinder profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PartFinderLeadershipProfileInput"
      responses:
        "200":
          description: Updated leadership profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartFinderLeadershipProfile"
        "400":
          description: Invalid leadership profile
        "401":
          description: Unauthorized
  /feedback:
    post:
      operationId: createAppFeedback
      tags: [app-admin]
      summary: Submit public feedback
      description: Save a suggestion or problem report from the public sign-in experience
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppFeedbackInput"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppFeedbackSubmission"
        "400":
          description: Invalid feedback
  /admin/access:
    get:
      operationId: getAppAdminAccess
      tags: [app-admin]
      summary: Check app administrator access
      responses:
        "200":
          description: App administrator access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAdminAccess"
        "401":
          description: Unauthorized
  /admin/feedback:
    get:
      operationId: getAppFeedback
      tags: [app-admin]
      summary: List app feedback
      description: List suggestions and problem reports for Every Part app administrators
      responses:
        "200":
          description: App feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppFeedbackList"
        "401":
          description: Unauthorized
        "403":
          description: App administrator access required
  /admin/feedback/{id}:
    patch:
      operationId: updateAppFeedback
      tags: [app-admin]
      summary: Update an app feedback item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppFeedbackUpdateInput"
      responses:
        "200":
          description: Updated feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppFeedback"
        "400":
          description: Invalid feedback update
        "401":
          description: Unauthorized
        "403":
          description: App administrator access required
        "404":
          description: Feedback item not found
  /early-access/welcome:
    get:
      operationId: getEarlyAccessWelcome
      tags: [churches]
      summary: Get the signed-in church's Early Access welcome state
      responses:
        "200":
          description: Early Access welcome state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyAccessWelcome"
        "401":
          description: Unauthorized
    post:
      operationId: acknowledgeEarlyAccessWelcome
      tags: [churches]
      summary: Acknowledge the signed-in church's Early Access welcome
      responses:
        "200":
          description: Early Access welcome acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyAccessWelcomeAcknowledgement"
        "401":
          description: Unauthorized
  /admin/early-access/overview:
    get:
      operationId: getEarlyAccessOverview
      tags: [app-admin]
      summary: Get aggregate Early Access usage for the platform owner
      responses:
        "200":
          description: Early Access overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EarlyAccessOverview"
        "401":
          description: Unauthorized
        "403":
          description: App administrator access required
  /billing/plans:
    get:
      operationId: getBillingPlans
      tags: [billing]
      summary: List the active Every Part subscription plans
      responses:
        "200":
          description: Active subscription plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPlanList"
  /billing/subscription:
    get:
      operationId: getBillingSubscription
      tags: [billing]
      summary: Get the signed-in church billing status
      responses:
        "200":
          description: Church billing status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingSubscription"
        "401":
          description: Unauthorized
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      tags: [billing]
      summary: Create a Stripe Checkout session for a church plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingCheckoutInput"
      responses:
        "200":
          description: Stripe Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCheckoutResponse"
        "400":
          description: Invalid plan or unavailable price
        "401":
          description: Unauthorized
  /billing/portal:
    post:
      operationId: createBillingPortal
      tags: [billing]
      summary: Create a Stripe customer portal session
      responses:
        "200":
          description: Stripe customer portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPortalResponse"
        "400":
          description: No Stripe customer exists
        "401":
          description: Unauthorized
  /church:
    get:
      operationId: getMyChurch
      tags: [churches]
      summary: Get the signed-in administrator's church
      responses:
        "200":
          description: Church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Church"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMyChurch
      tags: [churches]
      summary: Update church setup information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchUpdate"
      responses:
        "200":
          description: Updated church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Church"
        "401":
          description: Unauthorized
  /church/admins:
    get:
      operationId: listChurchAdmins
      tags: [churches]
      summary: List pastors with access to the signed-in church
      responses:
        "200":
          description: Church administrators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChurchAdmin"
        "401":
          description: Unauthorized
    post:
      operationId: addChurchAdmin
      tags: [churches]
      summary: Add an existing Clerk user as a church administrator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchAdminAddInput"
      responses:
        "201":
          description: Added administrator
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchAdmin"
        "400":
          description: Invalid administrator
        "401":
          description: Unauthorized
        "404":
          description: No Clerk account was found for the email address
        "409":
          description: User is already an administrator
  /church/admins/{id}:
    delete:
      operationId: removeChurchAdmin
      tags: [churches]
      summary: Remove a pastor's access to the signed-in church
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Administrator removed
        "400":
          description: The church owner cannot be removed
        "401":
          description: Unauthorized
        "404":
          description: Administrator not found
  /churches/{slug}:
    get:
      operationId: getPublicChurch
      tags: [churches]
      summary: Get the public church profile destination
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public church information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChurch"
        "404":
          description: Church not found
        "422":
          description: Church assessment configuration is invalid
  /churches/{slug}/admin-access:
    get:
      operationId: getChurchAdminAccess
      tags: [churches]
      summary: Check whether the signed-in user may override a youth pathway
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Church-specific override access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchAdminAccess"
        "401":
          description: Unauthorized
        "404":
          description: Church not found
  /churches/{slug}/logo:
    get:
      operationId: getPublicChurchLogo
      tags: [churches]
      summary: Get the approved public logo for a church
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Church logo image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Logo not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [churches]
      summary: Request an authenticated image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata
        "401":
          description: Unauthorized
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard totals and recent profile activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List teams for the signed-in church
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MinistryTeam"
        "401":
          description: Unauthorized
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team for the signed-in church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreateInput"
      responses:
        "201":
          description: Created team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryTeam"
        "400":
          description: Invalid team
        "401":
          description: Unauthorized
  /teams/{id}:
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Update or archive a church team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdateInput"
      responses:
        "200":
          description: Updated team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryTeam"
        "400":
          description: Invalid team
        "401":
          description: Unauthorized
        "404":
          description: Team not found
  /teams/suggestions:
    post:
      operationId: generateTeamSuggestions
      tags: [teams]
      summary: Suggest starter ministry teams from completed profiles
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamSuggestionsInput"
      responses:
        "200":
          description: Starter team suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamSuggestionsResponse"
        "400":
          description: Invalid suggestion request
        "401":
          description: Unauthorized
  /teams/{id}/schedule:
    get:
      operationId: listTeamSchedule
      tags: [teams]
      summary: List schedule shifts for a church team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Team schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamScheduleItem"
        "401":
          description: Unauthorized
        "404":
          description: Team not found
    post:
      operationId: createTeamSchedule
      tags: [teams]
      summary: Schedule a volunteer shift for a church team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamScheduleInput"
      responses:
        "201":
          description: Created schedule shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamScheduleItem"
        "400":
          description: Invalid schedule shift
        "401":
          description: Unauthorized
        "404":
          description: Team or volunteer not found
  /team-schedule/{id}:
    patch:
      operationId: updateTeamSchedule
      tags: [teams]
      summary: Update a team schedule shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamScheduleUpdate"
      responses:
        "200":
          description: Updated schedule shift
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamScheduleItem"
        "400":
          description: Invalid schedule shift
        "401":
          description: Unauthorized
        "404":
          description: Schedule shift not found
    delete:
      operationId: deleteTeamSchedule
      tags: [teams]
      summary: Remove a team schedule shift
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Schedule shift removed
        "401":
          description: Unauthorized
        "404":
          description: Schedule shift not found
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List completed Ministry Profiles for the signed-in church
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: interest
          in: query
          required: false
          schema:
            type: string
        - name: passion
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileListItem"
        "401":
          description: Unauthorized
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Submit a Ministry Profile for a church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Submitted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryProfile"
        "400":
          description: Invalid profile
        "404":
          description: Church not found
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List people and Ministry Profile invitation status for the signed-in church
      responses:
        "200":
          description: People and invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MinistryPerson"
        "401":
          description: Unauthorized
    post:
      operationId: createPerson
      tags: [people]
      summary: Add a person and create a private Ministry Profile invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MinistryPersonInput"
      responses:
        "201":
          description: Person and invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryPerson"
        "400":
          description: Invalid person
        "401":
          description: Unauthorized
  /people/{id}/invite:
    post:
      operationId: createPersonInvite
      tags: [people]
      summary: Renew a person's private Ministry Profile invitation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Renewed invitation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryPerson"
        "401":
          description: Unauthorized
        "404":
          description: Person not found
  /people/invites/{token}:
    get:
      operationId: getPublicPersonInvite
      tags: [people]
      summary: Validate a private Ministry Profile invitation
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Public invitation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPersonInvite"
        "404":
          description: Invitation not found or expired
  /profiles/{id}/schedule:
    get:
      operationId: listProfileSchedule
      tags: [profiles]
      summary: List schedule shifts assigned to a completed profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Profile schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamScheduleItem"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found
  /profiles/{id}/journey:
    get:
      operationId: getProfileJourney
      tags: [journeys]
      summary: Get the authenticated leader journey for a profile
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ministry journey timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyResponse"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found
  /journeys/{token}:
    get:
      operationId: getPublicJourney
      tags: [journeys]
      summary: Get a safe member-facing journey using its private token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Safe ministry journey timeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyResponse"
        "404":
          description: Journey not found
  /journeys/{token}/entries:
    post:
      operationId: createJourneyEntry
      tags: [journeys]
      summary: Add a milestone or annual check-in to a church journey
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyEntryInput"
      responses:
        "201":
          description: Journey entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyEntry"
        "400":
          description: Invalid entry
        "401":
          description: Unauthorized
        "404":
          description: Journey not found
  /journeys/entries/{id}:
    patch:
      operationId: updateJourneyEntry
      tags: [journeys]
      summary: Add or update a future reflection on a journey entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JourneyEntryUpdateInput"
      responses:
        "200":
          description: Updated journey entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyEntry"
        "400":
          description: Invalid entry
        "401":
          description: Unauthorized
        "404":
          description: Journey entry not found
  /journeys/{token}/compare/{leftProfileId}/{rightProfileId}:
    get:
      operationId: compareJourneyProfiles
      tags: [journeys]
      summary: Compare two historical profile snapshots using rule-based themes
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: leftProfileId
          in: path
          required: true
          schema: { type: integer }
        - name: rightProfileId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Profile comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JourneyCompareResponse"
        "400":
          description: Invalid comparison
        "401":
          description: Unauthorized
        "404":
          description: Journey or profile not found
  /profiles/matches:
    post:
      operationId: findVolunteerMatches
      tags: [profiles]
      summary: Find same-church Ministry Profiles that may fit a ministry need
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerMatchInput"
      responses:
        "200":
          description: Advisory volunteer matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerMatchResponse"
        "400":
          description: Invalid matching criteria
        "401":
          description: Unauthorized
  /youth-profiles:
    post:
      operationId: submitDiscoverProfile
      tags: [youth-profiles]
      summary: Submit a guardian-consented Discover profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscoverProfileInput"
      responses:
        "201":
          description: Submitted youth profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverProfileSubmission"
        "400":
          description: Invalid youth profile
        "404":
          description: Church not found
  /youth-profiles/{id}/result:
    get:
      operationId: getDiscoverResult
      tags: [youth-profiles]
      summary: Retrieve a youth discovery result with its opaque token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guardian-safe youth result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoverProfileResult"
        "404":
          description: Result not found
  /explore-profiles:
    post:
      operationId: submitExploreProfile
      tags: [youth-profiles]
      summary: Submit a guardian-consented Explore profile for ages 9 through 12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExploreProfileInput"
      responses:
        "201":
          description: Submitted Explore profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreProfileSubmission"
        "400":
          description: Invalid Explore profile
        "404":
          description: Church not found
  /explore-profiles/{id}/result:
    get:
      operationId: getExploreResult
      tags: [youth-profiles]
      summary: Retrieve a guardian-safe Explore result with its opaque token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guardian-safe Explore result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExploreProfileResult"
        "404":
          description: Result not found
  /develop-profiles:
    post:
      operationId: submitDevelopProfile
      tags: [youth-profiles]
      summary: Submit a guardian-consented Develop profile for ages 13 through 17
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopProfileInput"
      responses:
        "201":
          description: Submitted Develop profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopProfileSubmission"
        "400":
          description: Invalid Develop profile
        "404":
          description: Church not found
  /develop-profiles/{id}/result:
    get:
      operationId: getDevelopResult
      tags: [youth-profiles]
      summary: Retrieve a guardian-safe Develop result with its opaque token
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Guardian-safe Develop result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopProfileResult"
        "404":
          description: Result not found
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: View a completed Ministry Profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryProfile"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found
  /profiles/{id}/team:
    patch:
      operationId: updateProfileTeam
      tags: [profiles]
      summary: Assign or remove a profile's current team
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileTeamUpdateInput"
      responses:
        "200":
          description: Updated profile team assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileTeamAssignment"
        "400":
          description: Invalid team assignment
        "401":
          description: Unauthorized
        "404":
          description: Profile or team not found
  /profiles/{id}/helper:
    post:
      operationId: chatWithProfileHelper
      tags: [profiles]
      summary: Ask a pastor-facing helper about a completed adult profile
      description: Generates conversation-oriented guidance from safe structured profile signals
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileHelperInput"
      responses:
        "200":
          description: Profile helper response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileHelperResponse"
        "400":
          description: Invalid helper request or youth profile
        "401":
          description: Unauthorized
        "404":
          description: Profile not found
        "502":
          description: AI service unavailable
components:
  schemas:
    AssistantChatMessage:
