openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: churches
    description: Church setup and public profile access
  - name: dashboard
    description: Pastor and administrator dashboard operations
  - name: profiles
    description: Ministry Profile submissions and results
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /church:
    get:
      operationId: getMyChurch
      tags: [churches]
      summary: Get the signed-in administrator's church
      responses:
        "200":
          description: Church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Church"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMyChurch
      tags: [churches]
      summary: Update church setup information
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchUpdate"
      responses:
        "200":
          description: Updated church
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Church"
        "401":
          description: Unauthorized
  /churches/{slug}:
    get:
      operationId: getPublicChurch
      tags: [churches]
      summary: Get the public church profile destination
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public church information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicChurch"
        "404":
          description: Church not found
        "422":
          description: Church assessment configuration is invalid
  /churches/{slug}/logo:
    get:
      operationId: getPublicChurchLogo
      tags: [churches]
      summary: Get the approved public logo for a church
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Church logo image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: Logo not found
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [churches]
      summary: Request an authenticated image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid image metadata
        "401":
          description: Unauthorized
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard totals and recent profile activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          description: Unauthorized
  /profiles:
    get:
      operationId: listProfiles
      tags: [profiles]
      summary: List completed Ministry Profiles for the signed-in church
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: interest
          in: query
          required: false
          schema:
            type: string
        - name: passion
          in: query
          required: false
          schema:
            type: string
        - name: availability
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileListItem"
        "401":
          description: Unauthorized
    post:
      operationId: createProfile
      tags: [profiles]
      summary: Submit a Ministry Profile for a church
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Submitted profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryProfile"
        "400":
          description: Invalid profile
        "404":
          description: Church not found
  /profiles/matches:
    post:
      operationId: findVolunteerMatches
      tags: [profiles]
      summary: Find same-church Ministry Profiles that may fit a ministry need
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerMatchInput"
      responses:
        "200":
          description: Advisory volunteer matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VolunteerMatchResponse"
        "400":
          description: Invalid matching criteria
        "401":
          description: Unauthorized
  /profiles/{id}:
    get:
      operationId: getProfile
      tags: [profiles]
      summary: View a completed Ministry Profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MinistryProfile"
        "401":
          description: Unauthorized
        "404":
          description: Profile not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Church:
      type: object
      required: [id, name, slug, profileUrl, adminName, adminEmail, primaryColor, accentColor]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        address: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        adminName: { type: string }
        adminEmail: { type: string, format: email }
        profileUrl: { type: string }
        completedProfileCount: { type: integer }
        enabledSpiritualGifts:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/SpiritualGiftName"
          uniqueItems: true
    ChurchUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        logoUrl:
          type: ["string", "null"]
          pattern: "^/objects/logos/[0-9]+/[0-9a-fA-F-]+$"
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        address: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        adminName: { type: string }
        adminEmail: { type: string, format: email }
        enabledSpiritualGifts:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpiritualGiftName"
    PublicChurch:
      type: object
      required: [name, slug, profileUrl, enabledSpiritualGifts, primaryColor, accentColor]
      properties:
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: ["string", "null"] }
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        profileUrl: { type: string }
        enabledSpiritualGifts:
          type: array
          minItems: 3
          uniqueItems: true
          items:
            $ref: "#/components/schemas/SpiritualGiftName"
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        size:
          type: integer
          minimum: 1
          maximum: 5242880
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/webp]
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    SpiritualGiftName:
      type: string
      enum:
        - Administration
        - Apostleship
        - Discernment of Spirits
        - Evangelism
        - Exhortation / Encouragement
        - Faith
        - Giving
        - Healing
        - Helps / Service
        - Hospitality
        - Interpretation of Tongues
        - Knowledge
        - Leadership
        - Mercy
        - Miracles
        - Pastoring / Shepherding
        - Prophecy
        - Teaching
        - Tongues
        - Wisdom
        - Craftsmanship
        - Intercession
        - Missionary / Cross-Cultural Ministry
        - Music / Worship
        - Celibacy
        - Voluntary Poverty
    DashboardSummary:
      type: object
      required: [church, totalProfiles, recentProfiles, topInterests, topPassions]
      properties:
        church:
          $ref: "#/components/schemas/Church"
        totalProfiles: { type: integer }
        recentProfiles:
          type: array
          items:
            $ref: "#/components/schemas/ProfileListItem"
        topInterests:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
        topPassions:
          type: array
          items:
            $ref: "#/components/schemas/CountItem"
    CountItem:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer }
    ProfileListItem:
      type: object
      required: [id, memberName, email, completedAt, interests, passions, availability]
      properties:
        id: { type: integer }
        memberName: { type: string }
        email: { type: string, format: email }
        completedAt: { type: string, format: date-time }
        interests:
          type: array
          items: { type: string }
        passions:
          type: array
          items: { type: string }
        availability:
          type: array
          items: { type: string }
        servingFrequency: { type: ["string", "null"] }
    VolunteerMatchInput:
      type: object
      required: [roleDescription]
      properties:
        roleDescription:
          type: string
          minLength: 20
          maxLength: 2000
        ministryArea:
          type: string
          maxLength: 120
        preferredExperience:
          type: string
          maxLength: 500
        availability:
          type: array
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 80
    VolunteerMatchCandidate:
      type: object
      required: [id, memberName, score, matchLevel, reasons, interests, passions, availability, servingFrequency]
      properties:
        id: { type: integer }
        memberName: { type: string }
        score: { type: integer, minimum: 0, maximum: 100 }
        matchLevel:
          type: string
          enum: [Strong fit, Potential fit, Worth exploring]
        reasons:
          type: array
          minItems: 1
          maxItems: 4
          items: { type: string }
        interests:
          type: array
          items: { type: string }
        passions:
          type: array
          items: { type: string }
        availability:
          type: array
          items: { type: string }
        servingFrequency: { type: ["string", "null"] }
    VolunteerMatchResponse:
      type: object
      required: [candidates, summary, advisory, usedAi]
      properties:
        candidates:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/VolunteerMatchCandidate"
        summary: { type: string }
        advisory: { type: string }
        usedAi: { type: boolean }
    MinistryProfile:
      allOf:
        - $ref: "#/components/schemas/ProfileListItem"
        - type: object
          required: [basicInformation, churchConnection, skills, experience, assessmentSections, conversations]
          properties:
            basicInformation:
              $ref: "#/components/schemas/BasicInformation"
            churchConnection:
              $ref: "#/components/schemas/ChurchConnection"
            skills:
              $ref: "#/components/schemas/SkillsAndExperience"
            experience:
              { type: string }
            assessmentSections:
              $ref: "#/components/schemas/FutureAssessmentSections"
            conversations:
              type: array
              items: { type: string }
            lifeExperiences: { type: ["object", "null"], additionalProperties: true }
            availabilityDetails: { type: ["object", "null"], additionalProperties: true }
            ministryPreferences: { type: ["object", "null"], additionalProperties: true }
    ProfileInput:
      type: object
      required: [churchSlug, basicInformation, churchConnection, passions, interests, availability, skills]
      properties:
        churchSlug: { type: string, minLength: 1 }
        basicInformation:
          $ref: "#/components/schemas/BasicInformationInput"
        churchConnection:
          $ref: "#/components/schemas/ChurchConnectionInput"
        passions:
          type: array
          minItems: 1
          items: { type: string }
        interests:
          type: array
          minItems: 1
          items: { type: string }
        servingFrequency: { type: string }
        availability:
          type: array
          items: { type: string }
        skills:
          $ref: "#/components/schemas/SkillsAndExperienceInput"
        languages: { type: ["object", "null"], additionalProperties: true }
        churchDetails: { type: ["object", "null"], additionalProperties: true }
        skillsDetails: { type: ["object", "null"], additionalProperties: true }
        lifeExperiences: { type: ["object", "null"], additionalProperties: true }
        availabilityDetails: { type: ["object", "null"], additionalProperties: true }
        ministryPreferences: { type: ["object", "null"], additionalProperties: true }
        assessmentSections:
          $ref: "#/components/schemas/AssessmentSectionsInput"
    BasicInformation:
      type: object
      required: [firstName, lastName, email, ageRange, preferredContact, familySituation, transportation]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        ageRange: { type: string }
        preferredContact: { type: string }
        familySituation: { type: string }
        transportation: { type: string }
        languages: { type: ["object", "null"], additionalProperties: true }
    BasicInformationInput:
      type: object
      required: [firstName, lastName, email, ageRange, preferredContact, familySituation, transportation]
      properties:
        firstName: { type: string, minLength: 1 }
        lastName: { type: string, minLength: 1 }
        email: { type: string, format: email }
        phone: { type: ["string", "null"] }
        ageRange: { type: string }
        preferredContact: { type: string }
        familySituation: { type: string }
        transportation: { type: string }
    ChurchConnection:
      type: object
      required: [attendanceLength, connectionLevel, followingJesusLength, servedBefore, previousService]
      properties:
        attendanceLength: { type: string }
        connectionLevel: { type: integer, minimum: 1, maximum: 5 }
        followingJesusLength: { type: string }
        servedBefore: { type: boolean }
        previousService: { type: ["string", "null"] }
        details: { type: ["object", "null"], additionalProperties: true }
    ChurchConnectionInput:
      type: object
      required: [attendanceLength, connectionLevel, followingJesusLength, servedBefore, previousService]
      properties:
        attendanceLength: { type: string }
        connectionLevel: { type: integer, minimum: 1, maximum: 5 }
        followingJesusLength: { type: string }
        servedBefore: { type: boolean }
        previousService: { type: ["string", "null"] }
    SkillsAndExperience:
      type: object
      required: [occupation, uniqueSkills, previousMinistryExperience, leadershipExperience, missionTripExperience, lifeExperience]
      properties:
        occupation: { type: ["string", "null"] }
        uniqueSkills: { type: ["string", "null"] }
        previousMinistryExperience: { type: ["string", "null"] }
        leadershipExperience: { type: ["string", "null"] }
        missionTripExperience: { type: ["string", "null"] }
        lifeExperience: { type: ["string", "null"] }
        details: { type: ["object", "null"], additionalProperties: true }
    SkillsAndExperienceInput:
      type: object
      required: [occupation, uniqueSkills, previousMinistryExperience, leadershipExperience, missionTripExperience, lifeExperience]
      properties:
        occupation: { type: ["string", "null"] }
        uniqueSkills: { type: ["string", "null"] }
        previousMinistryExperience: { type: ["string", "null"] }
        leadershipExperience: { type: ["string", "null"] }
        missionTripExperience: { type: ["string", "null"] }
        lifeExperience: { type: ["string", "null"] }
    FutureAssessmentSections:
      type: object
      required: [apest, spiritualGifts, personalityStrengths, naturalStrengths, spiritualHealth]
      properties:
        apest: { type: ["object", "null"] }
        spiritualGifts: { type: ["object", "null"] }
        personalityStrengths: { type: ["object", "null"] }
        naturalStrengths: { type: ["object", "null"] }
        spiritualHealth: { type: ["object", "null"] }
    AssessmentSectionsInput:
      type: object
      required: [spiritualGifts]
      properties:
        apest: { type: ["object", "null"], additionalProperties: true }
        spiritualGifts:
          $ref: "#/components/schemas/SpiritualGiftsAssessment"
        personalityStrengths: { type: ["object", "null"], additionalProperties: true }
        naturalStrengths: { type: ["object", "null"], additionalProperties: true }
        spiritualHealth: { type: ["object", "null"], additionalProperties: true }
    SpiritualGiftsAssessment:
      type: object
      required: [responses]
      properties:
        responses:
          type: object
          additionalProperties:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: object
              required: [prompt, response]
              properties:
                prompt: { type: string, minLength: 1 }
                response: { type: integer, minimum: 1, maximum: 5 }

