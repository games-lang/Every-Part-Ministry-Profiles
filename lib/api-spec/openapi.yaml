                  opportunityKey: { type: string, enum: [welcome, prayer, kids, students, worship, production, scriptureReading, communityCare, missions, creative, events, behindTheScenes] }
                  opportunityLabel: { type: string }
                  response: { type: string, enum: [love, maybe] }
